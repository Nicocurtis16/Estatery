<nav
  [ngClass]="{
    'gap-12 ': menuType === 'navbar',
    'bg-gray-50 border border-gray-200 p-6': menuType === 'subcategories',
    'bg-white border border-gray-200 shadow-sm p-6': menuType === 'products'
  }"
  class="flex rounded-md"
>

    @for (item of menuData; track item) {

      @if (menuType === 'navbar') {
        <a
          href="#"
          class="block text-lg font-medium text-black hover:text-primary-200 hover:border-b-2 hover:border-primary-200 px-2 py-2 no-underline transition-colors duration-200"
        >
          {{ item }}
        </a>
      }
      @else if (menuType === 'subcategories') {
        <div class="flex flex-col items-center gap-3 p-4 hover:bg-gray-100 rounded-lg transition-colors">
          <img
            src="assets/images/subcategories/{{item | lowercase}}.png"
            alt="{{item}}"
            class="w-16 h-16 object-contain"
          >
          <a
            href="#"
            class="text-gray-700 hover:text-blue-600 text-center font-medium"
          >
            {{ item }}
          </a>
        </div>
      }
      @else if (menuType === 'products') {
        <div class="flex flex-col gap-4 p-5 border border-gray-200 rounded-lg hover:shadow-md transition-all">
          <img
            src="assets/images/products/{{item | lowercase}}.png"
            alt="{{item}}"
            class="w-full h-48 object-contain"
          >
          <div class="flex flex-col gap-2">
            <a
              href="#"
              class="text-pink-600 hover:text-pink-800 font-medium text-lg"
            >
              {{ item }}
            </a>
            <button class="bg-pink-100 text-pink-600 hover:bg-pink-200 py-2 px-4 rounded-md transition-colors">
              View Details
            </button>
          </div>
        </div>
      }

    }
</nav>
